name: Build setup wizard

# Builds SRE-Agent-Setup.exe (single file) and SRE-Agent-Setup-folder.zip with tools/wizard/build.ps1.
# Every run uploads both as a workflow artifact; a version tag (v1.0.0, v1.1.0, ...) also attaches
# them to the GitHub release of that tag, the download link to give to customers.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # only used to attach the files to the release of a version tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the setup wizard
        shell: pwsh
        run: ./tools/wizard/build.ps1 -Repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: SRE-Agent-Setup
          path: |
            dist/SRE-Agent-Setup.exe
            dist/SRE-Agent-Setup-folder.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title $env:TAG --notes "Download SRE-Agent-Setup.exe and double-click it. If your company blocks it, use SRE-Agent-Setup-folder.zip: extract it and double-click SRE-Agent-Setup.exe in the folder."
          }
          gh release upload $env:TAG dist/SRE-Agent-Setup.exe dist/SRE-Agent-Setup-folder.zip --clobber
